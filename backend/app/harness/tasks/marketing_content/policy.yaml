task_type: marketing_content
title: 마케팅 콘텐츠
description: 목적에 맞는 메시지를 실제 문구로 만들어요.
heading: 사람들에게 보여줄 홍보 글이 필요해요
deliverable: 게시글 · 행동 유도 문구
input_placeholder: 예) 새로 나온 겨울 한정 향초를 알리고 싶어요
input_examples:
  - 새로 나온 겨울 한정 향초를 알리고 싶어요
  - 반려견 목걸이 각인 이벤트를 홍보하고 싶어요
raw_input_field: product
readiness_threshold: 0.7
question_caps: { quick: 3, standard: 5, precise: 10 }
max_easier_level: 4
image_generation: true
fields:
  - name: product
    label: 홍보 상품
    kind: must_confirm
    weight: 3
    question: 어떤 상품을 홍보하나요?
    easier_questions:
      - question: 이번에 알리고 싶은 상품 이름 하나만 말해 주세요.
  - name: target_customer
    label: 목표 고객
    kind: must_confirm
    weight: 3
    question: 이 콘텐츠를 누가 봤으면 하나요?
    options: [기존 구매 고객, 처음 보는 20~30대, 선물을 찾는 사람, 근처 지역 주민]
    easier_questions:
      - question: 이 글에 '좋아요'를 눌러 줬으면 하는 사람은 누구인가요?
      - question: 둘 중 더 가까운 쪽을 골라 주세요.
        options: [이미 아는 고객, 처음 만나는 고객]
  - name: content_goal
    label: 콘텐츠 목적
    kind: must_confirm
    weight: 3
    question: 이 콘텐츠로 무엇을 이루고 싶나요?
    options: [구매 유도, 브랜드 알리기, 이벤트 홍보, 신상품 출시 알림]
    easier_questions:
      - question: 이 글을 본 사람이 바로 해 줬으면 하는 행동은 무엇인가요?
  - name: channel
    label: 채널
    kind: must_confirm
    weight: 2
    question: 어디에 올릴 콘텐츠인가요?
    options: [인스타그램 피드, 인스타그램 릴스·숏폼, 스마트스토어 상세페이지, 블로그, 광고 문구]
    easier_questions:
      - question: 고객을 가장 자주 만나는 곳은 어디인가요?
  - name: key_message
    label: 핵심 메시지
    kind: ai_suggest
    weight: 2
    question: 꼭 전하고 싶은 한 마디는 무엇인가요?
    easier_questions:
      - question: 고객이 이 글을 보고 딱 하나만 기억한다면 무엇이면 좋겠나요?
  - name: evidence
    label: 근거
    kind: ai_suggest
    weight: 1
    question: 메시지를 믿게 할 근거가 있나요?
    options: [실제 고객 후기, 재료·제작 과정, 수상·인증, 판매 실적]
    multi_select: true
    easier_questions:
      - question: 고객에게 들었던 칭찬 중 기억나는 말이 있나요?
  - name: cta
    label: 행동 유도
    kind: ai_suggest
    weight: 1
    question: 보는 사람이 무엇을 하게 할까요?
    options: [구매하기, 프로필 링크 방문, 댓글·DM 문의, 저장·공유]
    easier_questions:
      - question: 글 마지막 문장에 어떤 부탁을 넣고 싶나요?
  - name: tone_length
    label: 톤·길이
    kind: default
    weight: 1
    default: 친근한 톤, 중간 길이
private_fields: [price]
supplement_fields:
  - { name: product_spec, label: 상품 사양, example: 한글 형태를 활용한 소형 파우치 }
  - { name: launch_date, label: 공개 일정, example: 일정 미정 }
  - { name: price, label: 가격, example: 가격 미정 }
  - { name: purchase_link, label: 구매 링크, example: 링크 준비 중 }
carry_over: { product_and_customer: product, product_idea: product, business_idea: product, core_customer: target_customer, user: target_customer, tone_and_manner: tone_length }
rules:
  - 확인되지 않은 효능을 쓰지 않는다
  - 과장 광고를 하지 않는다
  - 채널에 맞지 않는 형식을 쓰지 않는다
  - 행동 유도(CTA)를 빠뜨리지 않는다
