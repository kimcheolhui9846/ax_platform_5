[project]
name = "ax-coaching-backend"
version = "0.1.0"
description = "AX 코칭 플랫폼 백엔드"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi[standard]>=0.143.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
