# 렌더(render.com) 블루프린트: 백엔드 API를 무료 플랜으로 띄운다. 절차는 docs/DEPLOY.md.
# 렌더 무료 플랜은 디스크가 없지만 세션·결과 이미지는 Neon(무료 Postgres)에 남아서 서버가 다시 시작해도(잠들었다 깸·재배포) 지워지지 않는다.
# DATABASE_URL(Neon 연결 문자열)은 비밀 값이라 대시보드에만 넣는다. 머지 전에 넣어야 한다(없으면 서버가 시작하지 못한다): docs/DEPLOY.md "Neon 연결".
# 개발자 개인 렌더·Neon 계정의 서비스다(인수 시 교체·삭제: docs/HANDOFF.md "개인 계정·키·로컬 데이터"). 프로토타입 시연용이다.
services:
  - type: web
    name: ax-coaching-api
    runtime: python
    plan: free
    rootDir: backend # uv.lock이 있어 렌더가 uv를 깔아 준다
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/coaching/tasks
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # 모델 제공자는 대시보드에서 고른다(mock | claude | openai). 블루프린트가 덮어쓰지 않게 값은 여기 두지 않는다.
      # 실제 호출은 BAZE 게이트웨이 키 하나로(docs/DEPLOY.md "BAZE"). 공개 주소라 누구나 호출하면 BAZE 계정에 과금된다.
      # PROVIDER를 claude/openai로 바꿀 때는 그쪽 API 키도 같이 넣는다(없으면 서버가 시작하지 못한다).
      - key: PROVIDER
        sync: false
      - key: CLAUDE_BASE_URL
        value: https://api.baze.co/v1/gateway/claude
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5 # 비용: Opus의 절반. 더 싸게 claude-haiku-5-5
      - key: CLAUDE_API_KEY
        sync: false # BAZE 키. 대시보드에만(커밋 금지, 개인 키는 인수 시 폐기)
      - key: OPENAI_BASE_URL
        value: https://api.baze.co/v1/gateway
      - key: OPENAI_MODEL
        value: gpt-6.1-terra
      - key: OPENAI_API_KEY
        sync: false # BAZE 키(같은 값). 대시보드에만
      - key: IMAGE_PROVIDER
        value: mock
      - key: STORE
        value: postgres # Neon 무료 Postgres. 다시 시작해도 남는다
      - key: DATABASE_URL
        sync: false # 값은 렌더 대시보드 Environment에만 넣는다(커밋 금지)
      - key: DEBUG
        value: "false"
